spring:
  datasource:
    url: jdbc:sqlite:./data/pokemon.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000

server:
  port: 8080

pokeapi:
  base-url: https://pokeapi.co/api/v2

jwt:
  secret: a-long-random-secret-key-for-jwt-token-generation-min-256-bits-long-enough
  expiration: 86400000

logging:
  level:
    com.pokemon.pokeapi: DEBUG
    com.pokemon.pokeapi.config.RequestLoggingFilter: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
